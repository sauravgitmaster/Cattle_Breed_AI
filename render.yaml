services:
  - type: web
    name: cattle-breed-ai-api
    runtime: python
    rootDir: Backend_new/breedai_public_backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn backend:app --bind 0.0.0.0:$PORT --workers 1 --threads 2 --timeout 180
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
